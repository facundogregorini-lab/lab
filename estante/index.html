<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<meta name="robots" content="noindex">
<meta name="description" content="Tu registro de libros, películas, documentales y podcasts.">
<title>Estante</title>
<link rel="manifest" href="/estante/manifest.webmanifest">
<link rel="icon" href="/estante/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/estante/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estante">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/estante/styles.css">
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Navegación principal">
    <a href="#/" data-tab="inicio">
      <svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="#/biblioteca" data-tab="biblioteca">
      <svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Biblioteca</a>
    <a href="#/agregar" data-tab="agregar" class="tab-add" aria-label="Agregar">
      <svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="#/descubrir" data-tab="descubrir">
      <svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg>Descubrir</a>
    <a href="#/anio" data-tab="anio">
      <svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Tu año</a>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<dialog id="manualDialog" class="sheet" aria-labelledby="manualTitle">
  <form id="manualForm" method="dialog">
    <div class="sheet-head">
      <h2 id="manualTitle">Cargar a mano</h2>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <label class="field"><span>Tipo</span>
      <select name="type"><option value="libro">Libro</option><option value="peli">Película</option><option value="doc">Documental</option><option value="pod">Podcast</option></select></label>
    <label class="field"><span>Título</span><input name="title" required maxlength="200" autocomplete="off"></label>
    <label class="field"><span id="manualCreatorLabel">Autor</span><input name="creator" maxlength="160" autocomplete="off"></label>
    <div class="field-row">
      <label class="field"><span>Año</span><input name="year" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="2024"></label>
      <label class="field"><span id="manualLengthLabel">Páginas</span><input name="length" type="number" inputmode="numeric" min="0" max="100000"></label>
    </div>
    <label class="field"><span>Estado</span>
      <select name="status"><option value="pendiente">Pendiente</option><option value="encurso">En curso</option><option value="terminado">Terminado</option></select></label>
    <button class="btn btn-dark btn-block" type="submit">Agregar al estante</button>
  </form>
</dialog>

<dialog id="scanDialog" class="sheet" aria-labelledby="scanTitle">
  <div class="sheet-head">
    <h2 id="scanTitle">Escanear ISBN</h2>
    <button type="button" class="icon-btn" data-close aria-label="Cerrar"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="scan-box"><video id="scanVideo" playsinline muted></video><span class="scan-line" aria-hidden="true"></span></div>
  <p class="muted small center" id="scanMsg">Apuntá la cámara al código de barras del libro.</p>
</dialog>

<script src="/estante/app.js" defer></script>
</body>
</html>
