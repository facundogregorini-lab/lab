<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F2240">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Caja">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/caja/manifest.webmanifest">
  <link rel="icon" href="/caja/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/caja/apple-touch-icon.png">
  <title>Caja · Consultorio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0F2240; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    iframe { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: #F7F5F0; }
    #lock { position: fixed; inset: 0; z-index: 10; background: #0F2240; color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
    #lock.on { display: flex; }
    #lock img { width: 84px; height: 84px; border-radius: 22px; }
    #lock h1 { margin: 0; font-size: 22px; font-weight: 600; }
    #lock p { margin: 0; color: #b8c6da; font-size: 15px; max-width: 300px; line-height: 1.4; }
    .btn { border: 0; border-radius: 999px; padding: 14px 26px; font-size: 17px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn.claro { background: #8EC5F5; color: #0F2240; box-shadow: 0 4px 0 #5f93c4; }
    .btn.claro:active { transform: translateY(3px); box-shadow: 0 1px 0 #5f93c4; }
    #oferta { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; background: #0F2240; color: #fff; border-radius: 18px; padding: 14px 16px; display: none; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(15,34,64,.35); }
    #oferta.on { display: flex; }
    #oferta span { flex: 1; font-size: 15px; line-height: 1.3; }
    #oferta .btn { padding: 10px 16px; font-size: 15px; }
    #oferta .no { background: none; color: #b8c6da; padding: 10px 6px; }
  </style>
</head>
<body>
  <iframe id="app" title="Caja del consultorio" allow="camera; microphone; clipboard-write"></iframe>

  <div id="lock">
    <img src="/caja/icon-192.png" alt="">
    <h1>Caja del consultorio</h1>
    <p id="lock-msg">Usá tu huella o tu cara para entrar.</p>
    <button class="btn claro" id="lock-btn">🔒 Desbloquear</button>
  </div>

  <div id="oferta">
    <span>🔒 Protegé la caja con tu huella o tu cara, como una app de banco.</span>
    <button class="btn no" id="oferta-no">Ahora no</button>
    <button class="btn claro" id="oferta-si">Activar</button>
  </div>

  <script>
  (function () {
    var APP = 'https://script.google.com/macros/s/AKfycbzdezKOp_CRZSz6_T7GOz-_t-6MNpKvUt9CXLHptUfl8aKm26O3LWvlFyjepmYfHNHe/exec';
    var CLAVE = 'caja_huella', RELOCK_MIN = 5;
    var $ = function (id) { return document.getElementById(id); };
    var leer = function () { try { return localStorage.getItem(CLAVE); } catch (e) { return null; } };
    var guardar = function (v) { try { localStorage.setItem(CLAVE, v); } catch (e) {} };
    var b64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
    var deb64 = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
    var azar = function (n) { var u = new Uint8Array(n); crypto.getRandomValues(u); return u; };
    var soporta = !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
    var cargada = false;
    function cargarApp() { if (!cargada) { $('app').src = APP; cargada = true; } }

    function bloquear() { $('lock').classList.add('on'); $('lock-msg').textContent = 'Usá tu huella o tu cara para entrar.'; }
    function desbloquear() {
      var id = leer(); if (!id) { $('lock').classList.remove('on'); cargarApp(); return; }
      navigator.credentials.get({ publicKey: {
        challenge: azar(32), rpId: location.hostname, timeout: 60000, userVerification: 'required',
        allowCredentials: [{ type: 'public-key', id: deb64(id) }]
      } }).then(function () {
        $('lock').classList.remove('on'); cargarApp();
      }).catch(function () {
        $('lock-msg').textContent = 'No se pudo verificar. Tocá "Desbloquear" para intentar de nuevo.';
      });
    }
    function activar() {
      navigator.credentials.create({ publicKey: {
        challenge: azar(32),
        rp: { name: 'Caja del consultorio', id: location.hostname },
        user: { id: azar(16), name: 'caja', displayName: 'Caja del consultorio' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
        timeout: 60000, attestation: 'none'
      } }).then(function (c) {
        guardar(b64(c.rawId)); $('oferta').classList.remove('on');
      }).catch(function () {});
    }

    $('lock-btn').onclick = desbloquear;
    $('oferta-si').onclick = activar;
    $('oferta-no').onclick = function () { $('oferta').classList.remove('on'); };

    if (leer() && soporta) { bloquear(); desbloquear(); }
    else {
      cargarApp();
      if (soporta && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
        PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (ok) {
          if (ok) setTimeout(function () { $('oferta').classList.add('on'); }, 2500);
        }).catch(function () {});
      }
    }

    // Como en las apps de banco: si la app quedó en segundo plano más de unos minutos, vuelve a pedir la huella.
    var oculto = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { oculto = Date.now(); return; }
      if (leer() && soporta && oculto && Date.now() - oculto > RELOCK_MIN * 60000) { bloquear(); desbloquear(); }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/caja/sw.js', { scope: '/caja/' });
  })();
  </script>
</body>
</html>
